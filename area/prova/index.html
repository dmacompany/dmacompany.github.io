<style>
/* Layout: app mobile-first a colonna unica; testata con allievo selezionato, schede in basso su telefono, in alto su desktop */
:root{
  --bg:#F6F2F2;--card:#FFFFFF;--ink:#17141A;--ink2:#5E5760;--line:#E6DEDF;
  --rose:#E62C45;--rose-d:#C81E35;--rose-s:#FCE9EC;--ok:#2F7D5B;--ok-s:#E3F2EA;--warn:#9A5B00;--warn-s:#FFF1D9;--bar:#111014;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141214;--card:#1E1B1D;--ink:#F3EEEF;--ink2:#B7AEB1;--line:#322D2F;--rose-d:#FF6B7D;--rose-s:#3A1B21;--ok:#5CC495;--ok-s:#173226;--warn:#F0B35A;--warn-s:#3A2A12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141214;--card:#1E1B1D;--ink:#F3EEEF;--ink2:#B7AEB1;--line:#322D2F;--rose-d:#FF6B7D;--rose-s:#3A1B21;--ok:#5CC495;--ok-s:#173226;--warn:#F0B35A;--warn-s:#3A2A12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--f)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
.demo{background:var(--bar);color:#fff;font-size:12.5px;text-align:center;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px))}
.demo b{color:#FF8796}
header{background:#fff;border-bottom:1px solid #ECE6E7}
header .in{max-width:880px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#17141A;text-decoration:none}
.brand img{height:46px;width:auto;display:block}.brand img.word{height:15px}
.brand>span{display:flex;flex-direction:column}.brand small{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:#4A454C;margin-top:4px;text-align:right}
.who{display:flex;align-items:center;gap:10px;color:#17141A}
.who .lbl{font-size:12px;color:#5E5760;text-align:right;line-height:1.3}
.who .lbl b{display:block;color:#17141A;font-size:13.5px}
.av{width:36px;height:36px;border-radius:50%;background:#E62C45;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
main{max-width:880px;margin:0 auto;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-size:clamp(24px,4.6vw,32px);font-weight:800;line-height:1.15;text-wrap:balance}
h2{margin:0 0 12px;font-size:17px;font-weight:700}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-d)}
.muted{color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kids{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.kid{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.kid .av{width:28px;height:28px;font-size:11px}
.kid[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-s)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--rose-s);color:var(--rose-d)}.pill.n{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{min-width:0}.row .t b{display:block;font-weight:600}.row .t span{font-size:13px;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--warn-s);color:var(--warn)}
.alert b{display:block}
.alert.ok{background:var(--ok-s);color:var(--ok)}
.mesi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mese{border-radius:9px;padding:8px 4px;text-align:center;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink2)}
.mese i{display:block;font-style:normal;font-size:10.5px;font-weight:500;margin-top:2px}
.mese.ok{background:var(--ok-s);color:var(--ok);border-color:transparent}
.mese.due{background:var(--rose-s);color:var(--rose-d);border-color:transparent}
.mese.now{outline:2px solid var(--ink);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--rose);color:#fff;border:2px solid var(--rose);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--rose-d);border-color:var(--rose-d)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:7px 13px;font-size:11.5px}
.btn:focus-visible,.kid:focus-visible,.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{display:flex;gap:2px;max-width:880px;width:100%}
.tab{flex:1;background:none;border:0;padding:8px 4px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--rose-d);background:var(--rose-s)}
.login{max-width:430px;margin:34px auto 0}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;margin-top:14px}
.login input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.login input:focus{outline:2px solid var(--rose);border-color:transparent}
.or{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:12.5px;margin:20px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;text-align:center;font-size:22px!important}
.note{font-size:13px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.switch{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch input{width:44px;height:24px;accent-color:var(--rose);flex:none}
dl{margin:0;display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:8px 16px;font-size:14.5px}
dt{color:var(--ink2)}dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
@media (min-width:760px){.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line)}.tab{flex-direction:row;font-size:13.5px;padding:10px}main{padding-bottom:40px}.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head><body>

/* ===== Viste ===== */
function kidsBar(){return `<div class="kids" role="group" aria-label="Allievo">${SOCIO.figli.map(k=>`<button class="kid" data-a="kid" data-id="${k.id}" aria-pressed="${k.id===S.kid}"><span class="av">${ini(k)}</span>${k.nome}</button>`).join("")}</div>`}
function vHome(){const k=kid();const c=k.cert;
  const avvisi=[];
  if(k.daPagare)avvisi.push(`<div class="alert"><div><b>Quota di ${k.daPagare.per}: ${k.daPagare.imp}</b>Da pagare ${k.daPagare.scad}. <a href="#" data-a="go" data-id="pag" style="color:inherit;font-weight:700">Paga o carica la ricevuta</a></div></div>`);
  if(c.stato==="warn")avvisi.push(`<div class="alert"><div><b>Il certificato medico scade il ${c.scad}</b>Carica quello nuovo per continuare a frequentare. <a href="#" data-a="go" data-id="doc" style="color:inherit;font-weight:700">Carica il certificato</a></div></div>`);
  if(!avvisi.length)avvisi.push(`<div class="alert ok"><div><b>Tutto in regola</b>Pagamenti e certificato medico sono a posto.</div></div>`);
  return `<div class="view"><div class="kick">Stagione 2026/27</div><h1>Ciao ${SOCIO.genitore.nome}</h1>${kidsBar()}
  <div class="stack">${avvisi.join("")}
  <div class="grid2">
   <div class="card"><h2>Iscrizione di ${k.nome}</h2><dl><dt>Stato</dt><dd><span class="pill ok">Socio · iscrizione confermata</span></dd><dt>Tessera</dt><dd>${k.tessera}</dd><dt>Frequenta dal</dt><dd>${k.inizio}</dd><dt>Formula</dt><dd>${k.formula}</dd></dl></div>
   <div class="card"><h2>Corsi e orari</h2>${k.corsi.map(x=>`<div class="row"><div class="t"><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join("")}
    <p class="note" style="margin:10px 0 0">Presenze a ${k.presenze.mese}: <b>${k.presenze.tot}</b> · dall'inizio: <b>${k.presenze.fatte}</b></p></div>
  </div>
  <div class="card"><h2>Quote della stagione</h2>${mesiGrid(k)}</div>
  </div></div>`}
function mesiGrid(k){return `<div class="mesi">${k.mesi.map((m,i)=>`<div class="mese ${m[1]==="ok"?"ok":m[1]==="due"?"due now":""}">${m[0]}<i>${m[1]==="ok"?"pagato":m[1]==="due"?"da pagare":m[1]==="n"?"—":"in arrivo"}</i></div>`).join("")}</div>
  <p class="note" style="margin:10px 0 0">${k.formula.includes("unica")?"Stagione pagata in un'unica soluzione.":"Le quote si pagano entro il 10 di ogni mese."}</p>`}
function vPag(){const k=kid();
  return `<div class="view"><div class="kick">Pagamenti</div><h1>Quote di ${k.nome}</h1>${kidsBar()}<div class="stack">
  ${k.daPagare?`<div class="card"><h2>Da pagare</h2><div class="row"><div class="t"><b>Quota di ${k.daPagare.per}</b><span>${k.daPagare.scad}</span></div><span class="num">${k.daPagare.imp}</span></div>
   <div class="card" style="background:var(--bg);margin-top:10px;padding:14px"><dl><dt>Intestato a</dt><dd>TINKERDANCE ASD</dd><dt>IBAN</dt><dd style="font-family:ui-monospace,Menlo,monospace">${IBAN}</dd><dt>Causale</dt><dd>Quota ${k.daPagare.per} ${k.cognome} ${k.nome}</dd></dl>
   <div class="actions" style="margin-top:12px"><button class="btn ghost small" data-a="copy" data-t="${IBAN.replace(/\s/g,"")}">Copia IBAN</button><button class="btn ghost small" data-a="copy" data-t="Quota ${k.daPagare.per} ${k.cognome} ${k.nome}">Copia causale</button></div></div>
   <div class="drop" style="margin-top:12px">${S.fileName?`<b>${S.fileName}</b><div class="note">pronta per l'invio</div>`:`<div class="note">Hai fatto il bonifico? Carica la ricevuta, anche uno screenshot dell'app della banca.</div>`}
    <div class="actions" style="justify-content:center;margin-top:10px"><label class="btn ghost small" for="fr">Scegli il file</label><input id="fr" type="file" accept="image/*,application/pdf" hidden>${S.fileName?`<button class="btn small" data-a="sendRic">Invia la ricevuta</button>`:""}</div></div>
   <p class="note" style="margin:10px 0 0">Preferisci pagare in contanti o con carta? Puoi farlo in segreteria prima della lezione.</p></div>`:`<div class="alert ok"><div><b>Nessuna quota da pagare</b>${k.formula.includes("unica")?"La stagione è pagata per intero.":"Sei in regola con i pagamenti."}</div></div>`}
  <div class="card"><h2>Stagione 2026/27</h2>${mesiGrid(k)}</div>
  <div class="card"><h2>Ricevute</h2>${k.ricevute.map(r=>`<div class="row"><div class="t"><b>Ricevuta n. ${r[0]} · ${r[1]}</b><span>${r[2]}</span>${r[4]?'<div><span class="pill n" style="margin-top:4px">detraibile 19%</span></div>':""}</div><div style="display:flex;gap:10px;align-items:center"><span class="num">${r[3]}</span><button class="btn ghost small" data-a="pdf">PDF</button></div></div>`).join("")}
   <p class="note" style="margin:10px 0 0">Le ricevute pagate con mezzi tracciabili sono valide per la detrazione delle spese sportive dei figli dai 5 ai 18 anni.</p></div>
  </div></div>`}
function vDoc(){const k=kid(),c=k.cert;
  return `<div class="view"><div class="kick">Documenti</div><h1>Documenti di ${k.nome}</h1>${kidsBar()}<div class="stack">
  <div class="card"><h2>Certificato medico</h2><div class="row"><div class="t"><b>Non agonistico</b><span>Scadenza ${c.scad}</span></div>${c.stato==="ok"?'<span class="pill ok">valido</span>':'<span class="pill warn">in scadenza</span>'}</div>
   <div class="drop" style="margin-top:10px"><div class="note">${c.stato==="ok"?"Quando lo rinnovi, carica qui quello nuovo.":"Carica il nuovo certificato: foto o PDF."}</div><div class="actions" style="justify-content:center;margin-top:10px"><button class="btn small" data-a="fake" data-t="Certificato inviato alla segreteria">Carica il certificato</button></div></div></div>
  <div class="card"><h2>Documenti dell'iscrizione</h2>
   <div class="row"><div class="t"><b>Domanda di ammissione a socio</b><span>firmata online il 15/09/2026</span></div><button class="btn ghost small" data-a="pdf">PDF</button></div>
   <div class="row"><div class="t"><b>Tessera ACSI 2026/27</b><span>${k.tessera} · con copertura assicurativa</span></div><button class="btn ghost small" data-a="pdf">PDF</button></div>
   <div class="row"><div class="t"><b>Statuto e regolamento</b><span>TinkerDance ASD</span></div><button class="btn ghost small" data-a="pdf">PDF</button></div>
   <div class="row"><div class="t"><b>Informativa privacy</b><span>Reg. UE 2016/679</span></div><button class="btn ghost small" data-a="pdf">PDF</button></div></div>
  </div></div>`}
function vMe(){const g=SOCIO.genitore;
  return `<div class="view"><div class="kick">Dati e consensi</div><h1>I tuoi dati</h1><div class="stack" style="margin-top:16px">
  <div class="card"><h2>Genitore</h2><dl><dt>Nome</dt><dd>${g.nome} ${g.cognome}</dd><dt>Codice fiscale</dt><dd>${g.cf}</dd><dt>Cellulare</dt><dd>${g.cell}</dd><dt>Email</dt><dd>${g.email}</dd><dt>Residenza</dt><dd>${g.indirizzo}</dd></dl>
   <div class="actions" style="margin-top:14px"><button class="btn ghost small" data-a="fake" data-t="Richiesta di modifica inviata alla segreteria">Chiedi una modifica</button></div></div>
  <div class="card"><h2>Consensi</h2>${SOCIO.figli.map(k=>`<div class="switch"><div><b>Foto e video di ${k.nome}</b><div class="note">Uso su sito e social di DMA COMPANY, senza nomi. Puoi cambiarlo quando vuoi.</div></div><input type="checkbox" role="switch" id="img_${k.id}" ${k.immagini?"checked":""} data-a="cons" data-id="${k.id}" aria-label="Consenso foto e video di ${k.nome}"></div>`).join("")}
   <div class="switch"><div><b>Trattamento dei dati per l'iscrizione</b><div class="note">Necessario per il rapporto associativo.</div></div><span class="pill ok">dato</span></div></div>
  <div class="card"><h2>Figli iscritti</h2>${SOCIO.figli.map(k=>`<div class="row"><div class="t"><b>${k.nome} ${k.cognome}</b><span>nato/a il ${k.nascita} · ${k.corsi.map(c=>c[0]).join(", ")}</span></div><span class="pill ok">socio</span></div>`).join("")}
   <div class="actions" style="margin-top:12px"><button class="btn ghost small" data-a="fake" data-t="Si apre il modulo di iscrizione con i tuoi dati già compilati">Iscrivi un altro figlio</button></div></div>
  <div class="actions"><button class="btn ghost" data-a="logout">Esci</button></div>
  </div></div>`}

/* ===== Render ===== */
function render(){
  const m=$("#main");
  if(!S.logged){$("#who").hidden=true;$("#tabs").hidden=true;m.innerHTML=vLogin();return}
  $("#who").hidden=false;$("#whoName").textContent=SOCIO.genitore.nome+" "+SOCIO.genitore.cognome;$("#whoAv").textContent=ini(SOCIO.genitore);
  $("#tabs").hidden=false;$("#tabsIn").innerHTML=TABS.map(t=>`<button class="tab" data-a="go" data-id="${t[0]}" ${S.view===t[0]?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t[0]]}</svg>${t[1]}</button>`).join("");
  m.innerHTML=({home:vHome,pag:vPag,doc:vDoc,me:vMe})[S.view]();
  const fr=$("#fr");if(fr)fr.onchange=e=>{const f=e.target.files[0];S.fileName=f?f.name:"";render()};
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(b.tagName==="A")e.preventDefault();
  switch(a){
    case"sendCode":S.step="code";render();setTimeout(()=>{const c=$("#cd");if(c)c.focus()},50);toast("Codice inviato (simulazione: 482915)");break;
    case"resend":toast("Nuovo codice inviato (simulazione: 482915)");break;
    case"back":S.step="email";render();break;
    case"verify":{const v=($("#cd").value||"").trim();if(v==="482915"){S.logged=true;S.view="home";render();window.scrollTo(0,0)}else{$("#cdErr").textContent="Codice non corretto: controlla l'email o chiedi un nuovo codice."}break}
    case"magic":S.logged=true;S.view="home";render();toast("Accesso con il link personale");break;
    case"kid":S.kid=b.dataset.id;S.fileName="";render();break;
    case"go":S.view=b.dataset.id;render();window.scrollTo(0,0);break;
    case"copy":try{await navigator.clipboard.writeText(b.dataset.t);toast("Copiato")}catch(x){toast(b.dataset.t)}break;
    case"sendRic":toast("Ricevuta inviata: la segreteria verifica l'accredito");S.fileName="";render();break;
    case"pdf":toast("Nella versione reale si scarica il PDF");break;
    case"fake":toast(b.dataset.t);break;
    case"logout":S.logged=false;S.step="email";render();window.scrollTo(0,0);break;
  }});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.a==="cons"){const k=SOCIO.figli.find(x=>x.id===t.dataset.id);k.immagini=t.checked;toast(t.checked?"Consenso foto e video dato per "+k.nome:"Consenso foto e video revocato per "+k.nome)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cd")document.querySelector('[data-a="verify"]').click()});
render();
</script>

</body></html>
